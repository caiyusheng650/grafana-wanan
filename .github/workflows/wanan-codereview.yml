name: wanan codereview

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  # 允许从PR分支直接触发，即使目标分支没有此配置
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: read
  # 添加必要的权限以允许从PR分支运行
  actions: read

jobs:
  wanan-codereview:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout Repo
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2) Capture Metadata
      - name: Normalize PR Metadata
        id: meta
        run: |
          echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_ENV
          echo "REPO_OWNER=${{ github.repository_owner }}" >> $GITHUB_ENV
          echo "REPO_NAME=${{ github.event.pull_request.head.repo.name }}" >> $GITHUB_ENV
          echo "AUTHOR=${{ github.actor }}" >> $GITHUB_ENV
          echo "RUN_ID=${{ github.run_id }}" >> $GITHUB_ENV
          echo "RUN_ATTEMPT=${{ github.run_attempt }}" >> $GITHUB_ENV
          echo "RUN_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV

          # Base64 encoding of title/body
          printf "%s" "${{ github.event.pull_request.title }}" | base64 -w0 > title.b64
          printf "%s" "${{ github.event.pull_request.body }}" | base64 -w0 > body.b64

      # 3) Capture README Content
      - name: Capture README Content
        run: |
          # 检查 README.md 是否存在，如果存在则进行编码，否则创建一个空文件
          if [ -f "README.md" ]; then
            echo "README.md found. Encoding content."
            printf "%s" "$(cat README.md)" | base64 -w0 > readme.b64
          else
            echo "README.md not found. Creating empty placeholder file."
            touch readme.b64
          fi

      # 4) Generate diff safely
      - name: Generate diff safely
        run: |
          BASE="${{ github.base_ref }}"
          if [ -z "$BASE" ]; then BASE="main"; fi
          
          # 在pull_request_target事件中，HEAD指向目标分支，需要获取PR分支的SHA
          PR_HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          
          # 使用PR分支SHA与目标分支进行diff比较
          DIFF_RAW=$(git diff -U3 "origin/$BASE"..."$PR_HEAD_SHA")

          # Prevent oversize
          DIFF_SIZE=$(echo "$DIFF_RAW" | wc -c)
          MAX=5000000
          if [ "$DIFF_SIZE" -gt "$MAX" ]; then
            echo "⚠️ Diff >5MB, truncating."
            DIFF_RAW=$(echo "$DIFF_RAW" | head -c $MAX)
          fi

          printf "%s" "$DIFF_RAW" | base64 -w0 > diff.b64

      # 5) Fetch Existing Comments
      - name: Fetch Existing Comments
        run: |
          echo "Fetching existing PR review comments for context..."
          # Fetch all review comments, keeping only relevant fields for the AI
          COMMENTS_JSON=$(gh api \
            repos/${{ github.repository }}/pulls/${{ env.PR_NUMBER }}/comments \
            --jq '[.[] | {id: .id, user: .user.login, body: .body, path: .path, line: .line}]')
          
          # Base64 encode the comments JSON
          printf "%s" "$COMMENTS_JSON" | base64 -w0 > comments.b64
          echo "Comments JSON encoded into comments.b64."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # 使用内置的 GITHUB_TOKEN 进行 API 访问

      # 6) Build JSON Payload
      - name: Build JSON Payload
        run: |
          cat <<EOF > payload.json
          {
            "githubactionid" : "${{ env.RUN_ID }}",
            "diff_base64": "$(cat diff.b64)",
            "pr_number": "${{ env.PR_NUMBER }}",
            "pr_title_b64": "$(cat title.b64)",
            "pr_body_b64": "$(cat body.b64)",
            "readme_b64": "$(cat readme.b64)",
            "repo_owner": "${{ env.REPO_OWNER }}",
            "repo_name": "${{ env.REPO_NAME }}",
            "author": "${{ env.AUTHOR }}",
            "comments_b64": "$(cat comments.b64)"
          }
          EOF
          
          echo "=== API Payload (payload.json) ==="
          cat payload.json
          echo "=================================="

      # 7) Send to AI Review API
      - name: Call AI Review API
        run: |
          # 打印API URL用于调试（注意：GitHub Actions会自动保护敏感信息）
          echo "使用的API URL: ${{ secrets.CODE_REVIEW_API_URL }}"
          
          curl -v -X POST \
            -H "X-Api-Key: ${{ secrets.CODE_REVIEW_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data-binary @payload.json \
            --max-time 3600 \
            "${{ secrets.CODE_REVIEW_API_URL }}/api/codereview/review" \
            -o response.json

          echo "=== API Response (response.json) ==-"
          cat response.json
          echo "===================================="

      # 8) Format markdown
      - name: Generate Review Markdown
        run: |
          # 首先根据严重程度生成conclusion
          jq '
            .conclusion = (
              if (.issues | to_entries | map(.value.severity) | any(. == "严重" or . == "中等")) 
              then "不建议合并" 
              else "建议合并" 
              end
            )
          ' response.json > temp.json && mv temp.json response.json
          
          # 然后生成Markdown（重点处理历史未修复问题）
          jq -r '
            "## 🤖 AI 代码审查意见\n" +
            "**合并建议**: \(.conclusion)\n\n" +
            "### 问题列表\n" +
            (
              .issues | to_entries | map(
                # 对历史未修复问题添加醒目标识
                (if .value.historical_mention == true then "⚠️ **[历史未修复问题]**\n" else "" end) +
                "- **文件**: " + .value.file +
                " (行 " + (.value.line|tostring) + ")\n" +
                "  - 类型: **" + .value.bug_type + "**\n" +
                "  - 程度: **" + .value.severity + "**\n" +
                # 历史问题补充提示文字
                (if .value.historical_mention == true then "  - 提示: 此问题已在历史审查中多次提及，请优先修复\n" else "" end) +
                "  - 描述: " + .value.description + "\n" +
                "  - 建议: " + .value.suggestion + "\n"
              ) | join("\n")
            )
          ' response.json > comment.md

          echo "Markdown generated:"
          cat comment.md

      # 9) Add inline comments
      - name: Add inline comments
        run: |
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          echo "HEAD_SHA=$HEAD_SHA"
          # 初始化计数器
          total_issues=0
          success_count=0
          failed_count=0
          # 读取问题总数（兼容空数组）
          total_issues=$(jq '.issues | length' response.json || echo 0)
          echo "Total issues to process: $total_issues"
          
          # 定义重试函数（处理临时网络错误）
          retry_gh_api() {
            local max_retries=3
            local retry_delay=2
            local attempt=1
            local exit_code=0

            while [ $attempt -le $max_retries ]; do
              echo "🔄 尝试第 $attempt 次调用 API (最多 $max_retries 次)"
              # 执行gh api，保留错误输出到临时文件
              gh api \
                repos/${{ github.repository }}/pulls/${{ env.PR_NUMBER }}/comments \
                -X POST \
                -f body="$1" \
                -f commit_id="$HEAD_SHA" \
                -f path="$2" \
                -F line="$3" > api_response.log 2> api_error.log
              exit_code=$?
              
              if [ $exit_code -eq 0 ]; then
                # 成功则清理日志并返回
                rm -f api_response.log api_error.log
                return 0
              fi
              
              # 失败则打印错误信息，延迟后重试
              echo "❌ API 调用失败 (尝试 $attempt): $(cat api_error.log)"
              attempt=$((attempt + 1))
              sleep $retry_delay
            done
            
            # 所有重试失败，保留错误日志
            echo "❌ 所有重试均失败，错误详情: $(cat api_error.log)"
            rm -f api_response.log api_error.log
            return $exit_code
          }

          # 循环处理每个问题（添加set -e禁用，确保循环不中断）
          set +e
          jq -c '.issues[]?' response.json | while read -r issue; do
            # 跳过空的issue
            if [ -z "$issue" ]; then
              echo "ℹ️  跳过空的issue条目"
              continue
            fi

            # 提取字段并做空值默认处理
            file=$(echo "$issue" | jq -r '.file // "unknown_file"')
            line=$(echo "$issue" | jq -r '.line // "0"')
            type=$(echo "$issue" | jq -r '.bug_type // "未知类型"')
            desc=$(echo "$issue" | jq -r '.description // "无描述"')
            sug=$(echo "$issue" | jq -r '.suggestion // "无建议"')
            sev=$(echo "$issue" | jq -r '.severity // "未知程度"')
            historical=$(echo "$issue" | jq -r '.historical_mention // "false"')

            # 跳过无效行号/文件（避免无意义的API调用）
            if [ "$file" = "unknown_file" ] || [ "$line" = "0" ] || [ "$line" = "null" ]; then
              echo "⚠️  跳过无效条目: 文件=$file 行号=$line"
              failed_count=$((failed_count + 1))
              continue
            fi

            # 处理历史未修复标记
            if [ "$historical" = "true" ]; then
              header="**AI 代码审查意见**"
              extra_note=$'\n**提示**: 此问题已在历史审查中多次提及，请优先处理'
            else
              header="**AI 代码审查意见**"
              extra_note=""
            fi

            # 拼接评论内容（转义特殊字符，避免printf解析错误）
            body=$(printf "%s\n**类型**: %s\n**描述**: %s\n**建议**: %s\n**程度**: %s%s" \
              "$header" "$type" "$(echo "$desc" | sed 's/[%\\]/\\&/g')" "$(echo "$sug" | sed 's/[%\\]/\\&/g')" "$sev" "$extra_note")
            echo "📝 准备添加内联评论到 $file:$line"

            # 调用重试函数添加评论
            if retry_gh_api "$body" "$file" "$line"; then
              echo "✅ Success: 添加评论到 $file:$line"
              success_count=$((success_count + 1))
            else
              echo "❌ ERROR: 无法添加评论到 $file:$line"
              failed_count=$((failed_count + 1))
            fi

            # 限速：避免API限流（每请求间隔0.5秒）
            sleep 0.5
          done
          set -e

          # 输出统计结果
          echo "========================================="
          echo "内联评论添加完成统计:"
          echo "总计问题数: $total_issues"
          echo "成功添加: $success_count"
          echo "失败数量: $failed_count"
          echo "========================================="

          # 警告但不终止工作流
          if [ $failed_count -gt 0 ]; then
            echo "⚠️  警告: 有 $failed_count 个评论添加失败，但工作流将继续执行"
          fi

          # 强制返回成功
          exit 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 10) Create Summary Comment
      - name: Create or update summary comment
        uses: peter-evans/create-or-update-comment@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ env.PR_NUMBER }}
          body-file: comment.md
          edit-mode: replace
